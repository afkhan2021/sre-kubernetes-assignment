apiVersion: batch/v1
kind: CronJob
metadata:
  name: system-info-collector
  namespace: sre-assignment
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 3

      template:
        spec:
          restartPolicy: OnFailure

          containers:
            - name: collector
              image: sre-kubernetes-app:1.2
              imagePullPolicy: Never

              command:
                - python
                - cron/collector.py

              env:
                - name: DB_HOST
                  value: postgres

                - name: DB_PORT
                  value: "5432"

                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_DB

                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER

                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
